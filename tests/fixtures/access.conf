<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride All
    Order allow,deny
    Allow from all
</Directory>
<Directory "/var/www/admin">
    Order deny,allow
    Deny from all
    Allow from 10.0.0.0/8 192.168.1.5 office.example.com
</Directory>
<Files "secret.txt">
    Order allow,deny
    Deny from all
</Files>
<Location /blocked>
    Order allow,deny
    Allow from all
    Deny from 1.2.3.4
</Location>
<Location /auth>
    AuthType Basic
    Require valid-user
    Order deny,allow
    Deny from all
    Allow from 10.0.0.1
    Satisfy any
</Location>
